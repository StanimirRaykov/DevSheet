# Full stack:        docker compose up --build        (web http://localhost:3000, API http://localhost:5217)
# Database only:     docker compose up -d db mailpit   (daily development: API and web run on the host)
# Emails sent in development land in Mailpit: http://localhost:8025
# Secrets and settings come from a git-ignored .env next to this file (copy .env.example).

x-api-image: &api-image
  build: ./api
  image: devsheet-api

x-database: &database
  ConnectionStrings__Default: Host=db;Port=5432;Database=devsheet;Username=devsheet;Password=${POSTGRES_PASSWORD:-devsheet}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: devsheet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devsheet}
      POSTGRES_DB: devsheet
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsheet -d devsheet"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Catches every email the API sends (confirm address, reset password) instead of delivering it.
  # Inbox: http://localhost:8025. SMTP on 1025, which is the API's default (Email:Smtp).
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports: ["1025:1025", "8025:8025"]
    restart: unless-stopped

  # One-shot database step: applies EF Core migrations and seeds the skill catalogue, then exits.
  # The API server itself never migrates outside Development.
  migrate:
    <<: *api-image
    command: ["--migrate"]
    environment:
      <<: *database
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    <<: *api-image
    ports: ["5217:8080"]
    environment:
      <<: *database
      WebOrigin: http://localhost:3000
      Authentication__GitHub__ClientId: ${GITHUB_CLIENT_ID:-}
      Authentication__GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET:-}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      # Inside the Docker network Mailpit is "mailpit", not localhost. Set EMAIL_SMTP_* for a real provider.
      Email__Smtp__Host: ${EMAIL_SMTP_HOST:-mailpit}
      Email__Smtp__Port: ${EMAIL_SMTP_PORT:-1025}
      Email__Smtp__Security: ${EMAIL_SMTP_SECURITY:-None}
      Email__Smtp__User: ${EMAIL_SMTP_USER:-}
      Email__Smtp__Password: ${EMAIL_SMTP_PASSWORD:-}
      Email__Smtp__From: ${EMAIL_FROM:-no-reply@devsheet.local}
    # Data Protection keys (login cookie, stored GitHub tokens). Kept in a volume so restarts don't log anyone out.
    volumes: [dpkeys:/keys]
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
    restart: unless-stopped
    # Health check (GET /health) is defined in api/Dockerfile.

  web:
    build:
      context: ./web
      args:
        # Used by the browser, so it is the host address, baked in at build time.
        NEXT_PUBLIC_API_URL: http://localhost:5217
    image: devsheet-web
    ports: ["3000:3000"]
    environment:
      # Used by server-side rendering inside the Docker network.
      API_URL: http://api:8080
      # Public address of the site, for robots.txt and the sitemap.
      SITE_URL: http://localhost:3000
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  dpkeys:
