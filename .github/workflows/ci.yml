name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"
      - name: Fail if the model changed without a migration
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --no-build --configuration Release --project src/DevSheet.Infrastructure --startup-project src/DevSheet.Api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: api/tests/**/TestResults/*.trx

  web:
    name: Web (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devsheet
          POSTGRES_PASSWORD: devsheet
          POSTGRES_DB: devsheet_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devsheet -d devsheet_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: web
    env:
      E2E_DATABASE: Host=localhost;Port=5432;Database=devsheet_e2e;Username=devsheet;Password=devsheet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Starts the API (Testing environment, stubbed GitHub) and a production build of the web app, then runs the tests.
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  docker:
    name: Docker (build images + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test
        run: |
          curl -fsS -o /dev/null -w "api /health %{http_code}\n" http://localhost:5217/health
          curl -fsS -o /dev/null -w "web / %{http_code}\n" http://localhost:3000/
          curl -fsS -o /dev/null -w "web /login %{http_code}\n" http://localhost:3000/login
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
